services:
  - type: web
    name: nexora712-platform
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_USERNAME
        value: NEXORA712
      - key: ADMIN_PHONE
        value: "+998901234567"
      - key: WEBAPP_URL
        sync: false
