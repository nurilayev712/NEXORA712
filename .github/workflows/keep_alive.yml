name: Keep Render 24/7 Alive

on:
  schedule:
    # Har 14 daqiqada avtomatik ishga tushadi (Render 15 daqiqada uhlab qoladi)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Qo'lda ham ishga tushirish imkoniyati

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          if [ -n "${{ secrets.RENDER_APP_URL }}" ]; then
            TARGET_URL="${{ secrets.RENDER_APP_URL }}"
          else
            echo "RENDER_APP_URL siri o'rnatilmagan bo'lsa, workflow o'tkazib yuboriladi."
            exit 0
          fi
          echo "Render serveriga ping yuborilmoqda: $TARGET_URL/health"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL/health" || true)
          echo "HTTP Javob kodi: $RESPONSE"
